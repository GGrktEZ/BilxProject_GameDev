<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="../css/tetris.css" />
  </head>

  <body>
    <h1>Tetris</h1>

    <div class="tetris_container">
      <!-- The board is drawn in here. TetrisMain.js looks for this id and
           sets the width and the height itself, so we do not write them. -->
      <canvas id="tetris_canvas"></canvas>
    </div>
    <h1 id="gameOverH1"></h1>

    <!-- The order matters. Every file uses things from the files above it:
         pieces (data) -> state (data) -> rules -> drawing -> start. -->
    <script src="./TetrisPieces.js"></script>
    <script src="./TetrisLogic.js"></script>
    <script src="./TetrisRender.js"></script>
    <script src="./TetrisMain.js"></script>
  </body>
</html>
